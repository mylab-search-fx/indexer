services:

  redis:
    container_name: redis
    image: redis:8.10
    volumes:
    - ./redis/redis.conf:/etc/redis/redis.conf
    - ./redis/users.acl:/etc/redis/users.acl
    - redis-data:/data
    command: redis-server /etc/redis/redis.conf --bind 0.0.0.0 --protected-mode no
    ports:
    - 16379:6379

  db:
    container_name: db
    image: mariadb:11.8.9
    environment:
      MYSQL_ROOT_PASSWORD: test
      MYSQL_USER: test
      MYSQL_PASSWORD: test
    volumes:
    - mariadb-data:/var/lib/mysql
    ports:
    - 13306:3306

  opensearch:
    image: opensearchproject/opensearch:3.7.0
    container_name: opensearch
    environment:
      discovery.type: single-node
      node.name: opensearch
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: ",w^&i!.m6A"
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    ports:
    - 19200:9200 


volumes:
  redis-data:
  mariadb-data:
  opensearch-data: