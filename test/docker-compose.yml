services:

  redis:
    container_name: redis
    image: redis:8.10
    volumes:
    - ./redis/redis.conf:/etc/redis/redis.conf
    - ./redis/users.acl:/etc/redis/users.acl
    - redis-data:/data
    command: redis-server /etc/redis/redis.conf --bind 0.0.0.0 --protected-mode no
    ports:
    - 16379:6379

  db:
    container_name: db
    image: mariadb:11.8.9
    environment:
      MYSQL_ROOT_PASSWORD: test
    volumes:
    - mariadb-data:/var/lib/mysql

volumes:
  redis-data:
  mariadb-data: